[project]
name = "culturelive"
version = "0.1.0"
description = "CultureLive — Google Calendar, classification sales, PostgreSQL (Projet Octave)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "google-api-python-client>=2.150.0",
  "google-auth-oauthlib>=1.2.0",
  "google-auth-httplib2>=0.2.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "cryptography>=43.0.0",
  "httpx>=0.28.0",
  "openai>=1.57.0",
  "python-multipart>=0.0.17",
  "streamlit>=1.40.0",
  "pandas>=2.2.0",
  "plotly>=5.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-order>=1.3.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "google_live: tests nécessitant OAuth Google réel",
  "db_live: tests PostgreSQL",
]

[tool.setuptools.packages.find]
where = ["backend", "integration", "dashboard"]
include = ["cultur_live*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

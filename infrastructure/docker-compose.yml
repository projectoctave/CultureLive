name: culturelive

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cultur_live}:${POSTGRES_PASSWORD:-cultur_live}@postgres:5432/${POSTGRES_DB:-cultur_live}
  PUBLIC_BASE_URL: https://${DOMAIN_NAME:-localhost}
  GOOGLE_REDIRECT_URI: https://${DOMAIN_NAME:-localhost}/api/auth/google/callback
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis (32 caractères minimum)}
  DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:?DASHBOARD_API_KEY requise (12 caractères minimum)}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cultur_live}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cultur_live}
      POSTGRES_DB: ${POSTGRES_DB:-cultur_live}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cultur_live} -d ${POSTGRES_DB:-cultur_live}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - culturelive

  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-../.env}
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - culturelive

  worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    command: ["python", "-m", "backend.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "backend.worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    env_file:
      - ${ENV_FILE:-../.env}
    environment:
      <<: *app-env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - culturelive

  dashboard:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.dashboard
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - culturelive

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    # Recharge périodiquement nginx pour prendre en compte les certificats renouvelés.
    command: ["/bin/sh", "-c", "(while :; do sleep 6h; nginx -s reload; done) & exec nginx -g 'daemon off;'"]
    depends_on:
      - api
      - dashboard
    networks:
      - culturelive

  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - culturelive

  seed:
    profiles: ["seed"]
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.seed
    env_file:
      - ${ENV_FILE:-../.env}
    environment:
      <<: *app-env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - culturelive

networks:
  culturelive:

volumes:
  pgdata:
  certbot-www:
  certbot-certs:

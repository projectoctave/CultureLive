name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint + tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: culturelive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: application
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/culturelive_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -v -m "not google_live"

  infrastructure:
    name: Infra (shellcheck, terraform, docker)
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
      DASHBOARD_API_KEY: ci-admin-api-key-123
      DOMAIN_NAME: ci.example.com
      ENV_FILE: ../.env.example
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -x -P SCRIPTDIR infrastructure/scripts/*.sh
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt / validate
        working-directory: infrastructure/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Docker compose config
        run: docker compose -f infrastructure/docker-compose.yml config -q
      - name: Docker build
        run: docker compose -f infrastructure/docker-compose.yml build api dashboard seed
